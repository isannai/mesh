<!doctype html>
<html lang="ko">
  <head>
    <!-- Default base for relative assets. The isannd remote-UI tunnel
         overwrites this with /node/<id>/ so the SPA loads under a dynamic
         prefix; at the root it stays "/" (no-op). Canvas reads it for the
         router basename. -->
    <base href="/" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>IANN Console</title>
    <script>
      document.documentElement.setAttribute(
        "data-theme",
        localStorage.getItem("iann_theme") || "dark"
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
